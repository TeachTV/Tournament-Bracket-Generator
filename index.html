  return {markup:pieces.join(''),width,height,data,R,start,top,step,x0,cardW,center,progress};
}

// Preserve the original self-language names before rewriting the menu options.
const nativeLanguageNames=Object.fromEntries(Array.from($('lang').options).map(option=>[option.value,option.textContent.trim()]));
function sortLanguageMenu(){
 const select=$('lang'),chosen=lang;
 const collator=new Intl.Collator(lang,{numeric:true,sensitivity:'base'});
 const labels=new Intl.DisplayNames([lang],{type:'language',languageDisplay:'standard'});
 const options=Array.from(select.options).map(option=>({code:option.value,
   name:labels.of(option.value)||nativeLanguageNames[option.value]||option.value}));
 // Sort only by the translated language name, not the native-language subtitle.
 options.sort((a,b)=>collator.compare(a.name,b.name)||a.code.localeCompare(b.code));
 select.replaceChildren(...options.map(item=>new Option(`${item.name} (${nativeLanguageNames[item.code]||item.code})`,item.code)));
 select.value=chosen;
}
function updateLanguage(l){lang=translations[l]?l:'ko';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';sortLanguageMenu();document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('input').placeholder=t('inputPlaceholder');render();save()}

refresh()});$('resetWinners').addEventListener('click',()=>{if(!teams.length)return;if(confirm(t('resetAsk'))){picks=Array.from({length:totalRounds()},()=>[]);groupStates={};refresh();}});
async function makeCanvas(){
  if(!teams.length)throw Error(t('need'));
  const svg=$('bracketArt');if(!svg)throw Error(t('imageFailed'));
  // Serialize the exact visible graphic, rather than redrawing a second version.
  const clone=svg.cloneNode(true);
  clone.removeAttribute('id');clone.removeAttribute('class');
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const width=Number(svg.getAttribute('width')),height=Number(svg.getAttribute('height'));
  const scale=height>6800?1:height>3500?1.15:1.5;
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);
  const ctx=canvas.getContext('2d');if(!ctx)throw Error(t('imageFailed'));
  const source=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  try{
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error(t('imageFailed')));img.src=url});
    ctx.scale(scale,scale);ctx.drawImage(img,0,0,width,height);
  }finally{URL.revokeObjectURL(url)}
  return canvas;
}
const blobFromCanvas=c=>new Promise((resolve,reject)=>c.toBlob(blob=>blob?resolve(blob):reject(Error(t('imageFailed'))),'image/png'));function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}

$('exportCsv').addEventListener('click',()=>{if(!teams.length){notify(t('need'),true);return}const rows=[[t('csvRound'),t('csvGroup'),t('csvTeamA'),t('csvTeamB'),t('csvWinner')]];bracketData().forEach((round,r)=>round.forEach((m,i)=>rows.push([roundName(r,totalRounds()),i+1,...m.sides.map(s=>s.team?.name||(s.status==='bye'?t('bye'):t('waiting'))),m.winner?.name||''])));downloadText('\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'tournament_matches.csv','text/csv;charset=utf-8')});
$('saveJson').addEventListener('click',()=>{if(!teams.length){notify(t('need'),true);return}downloadText(JSON.stringify({version:15,teams,picks,drawMode,drawOrder,lang,roundMode,manualRound,viewStart,groupStates,highlightRank,highlightScope},null,2),'tournament_backup.json','application/json')});$('loadJson').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async e=>{try{const f=e.target.files?.[0];if(!f)return;const json=JSON.parse(await f.text());if(!Array.isArray(json.teams)||!Array.isArray(json.picks))throw Error(t('invalidBackup'));const checked=parse(json.teams.map(v=>`${v.rank}\t${v.name}`).join('\n'));if(!confirm(t('backupAsk')))return;teams=checked;drawMode=json.drawMode==='random'&&isValidDrawOrder(json.drawOrder,checked)?'random':'ranked';drawOrder=drawMode==='random'?json.drawOrder:[];picks=json.picks;roundMode=json.roundMode==='manual'?'manual':'auto';manualRound=Number.isInteger(json.manualRound)?json.manualRound:0;viewStart=Number.isInteger(json.viewStart)?json.viewStart:0;highlightRank=Number.isSafeInteger(json.highlightRank)&&teams.some(tm=>tm.rank===json.highlightRank)?json.highlightRank:null;highlightScope=json.highlightScope==='last'?'last':'all';groupStates=json.groupStates&&typeof json.groupStates==='object'&&!Array.isArray(json.groupStates)?json.groupStates:{};$('input').value=teams.map(v=>`${v.rank}\t${v.name}`).join('\n');refresh();notify(t('restored'))}catch(err){notify(t('invalidBackup')+' '+err.message,true)}finally{e.target.value=''}});
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.teams)){teams=parse(s.teams.map(v=>`${v.rank}\t${v.name}`).join('\n'));drawMode=s.drawMode==='random'&&isValidDrawOrder(s.drawOrder,teams)?'random':'ranked';drawOrder=drawMode==='random'?s.drawOrder:[];picks=Array.isArray(s.picks)?s.picks:[];roundMode=s.roundMode==='manual'?'manual':'auto';manualRound=Number.isInteger(s.manualRound)?s.manualRound:0;viewStart=Number.isInteger(s.viewStart)?s.viewStart:0;highlightRank=Number.isSafeInteger(s.highlightRank)&&teams.some(tm=>tm.rank===s.highlightRank)?s.highlightRank:null;highlightScope=s.highlightScope==='last'?'last':'all';groupStates=s.groupStates&&typeof s.groupStates==='object'&&!Array.isArray(s.groupStates)?s.groupStates:{};$('input').value=s.input||teams.map(v=>`${v.rank}\t${v.name}`).join('\n');lang=translations[s.lang]?s.lang:'ko'}}catch(e){console.warn(e)}updateLanguage(lang);
